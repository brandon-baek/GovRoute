name: Dependency audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record the complete dependency audit, including development tools
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: govroute-dependency-audit
          path: dependency-audit.json
      - name: Reject known high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
