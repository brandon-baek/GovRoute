name: Refresh address release dependencies
on:
  push:
    branches: [codex/address-specific-guidance]
    paths: ['.github/workflows/address-dependencies.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/address-specific-guidance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched runtime and matching lint packages
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 zod@4.6.7
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.3
          npm audit fix --package-lock-only --ignore-scripts
      - name: Preserve resolved dependency changes on this review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update patched runtime dependencies and lockfile'
            git push origin HEAD:codex/address-specific-guidance
          fi
