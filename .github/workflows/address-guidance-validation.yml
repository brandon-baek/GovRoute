name: Address guidance validation
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'components/**'
      - 'app/**'
      - 'package*.json'
      - '.github/workflows/address-guidance-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: address-guidance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VERCEL: '1'
      - name: Live public-address provider checks
        run: npx tsx scripts/check-address-workspace.ts
# The existing foundation workflow retains its independent dependency-audit gate.
# This job exposes code/test failures even when that audit blocks the foundation job.

